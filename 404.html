<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Lean Six Sigma Green Belt</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1011">
  <script>
    // GitHub Pages sirve este archivo para cualquier ruta inexistente, a cualquier profundidad.
    // En un sitio de proyecto (usuario.github.io/repositorio/…) la base es «/repositorio/»; en otro dominio, «/».
    (function () {
      var partes = location.pathname.split('/').filter(Boolean);
      var base = /\.github\.io$/.test(location.hostname) && partes.length ? '/' + partes[0] + '/' : '/';
      document.write('<base href="' + base + '">');
    })();
  </script>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fuentes.css">

</head>

</body>
</html>
